<div class="auth-wrap fade-slide-in">
  <div class="auth-card">
    <div class="auth-icon">🛡️</div>
    <h2>Admin Login</h2>
    <p class="sub">Rescue Connect Administration</p>
    <p class="sub">Email: admin@rescueconnect<br>Password: rescueconnect@123<br>Backend: http://localhost:5000</p>
    <form name="loginForm" ng-submit="submit(loginForm)" novalidate>
      <label>Email</label>
      <input type="email" name="email" ng-model="credentials.email" placeholder="admin@rescueconnect" required>
      <label>Password</label>
      <input type="password" name="password" ng-model="credentials.password" placeholder="Enter admin password" required>
      <div class="error-msg" ng-if="error">{{error}}</div>
      <button type="submit" class="btn-primary" ng-disabled="loading">{{loading ? 'Signing in...' : 'Login as Admin'}}</button>
    </form>
    <p class="switch-link"><a href="#!/volunteer-login">I'm a volunteer &rarr;</a></p>
  </div>
</div>
